name: "📱 Hardware Compatibility Report"
description: "Submit benchmark results and stability verification for your device"
title: "[Device]: "
labels: ["device-report", "verified-hardware"]
body:
  - type: markdown
    attributes:
      value: "Thanks for testing the stack! Please fill in the details below so we can add your device to the official compatibility matrix."
  - type: input
    id: device_model
    attributes:
      label: "Device Model"
      placeholder: "e.g., Samsung Galaxy S24 Ultra / Galaxy Tab S9"
    validations:
      required: true
  - type: input
    id: soc_ram
    attributes:
      label: "SoC & RAM"
      placeholder: "e.g., Snapdragon 8 Gen 3, 12 GB RAM"
    validations:
      required: true
  - type: dropdown
    id: os_version
    attributes:
      label: "Android / One UI Version"
      options:
        - "One UI 7 (Android 15)"
        - "One UI 6.1.1 (Android 14)"
        - "One UI 6.0 (Android 14)"
        - "Older / Custom ROM / AOSP"
    validations:
      required: true
  - type: input
    id: glmark2_fps
    attributes:
      label: "glmark2 Score / FPS"
      placeholder: "e.g., 165 FPS (or 'Not tested')"
  - type: checkboxes
    id: features
    attributes:
      label: "Verification Checklist"
      options:
        - label: "VirGL hardware acceleration works without crashes"
        - label: "PulseAudio sound is synchronized with zero crackling"
        - label: "No process kills by Android LMK under heavy load"
  - type: textarea
    id: notes
    attributes:
      label: "Additional Observations & Tweaks"
      placeholder: "Notes on resolution, DPI scaling tweaks, thermals, or specific addons tested..."
